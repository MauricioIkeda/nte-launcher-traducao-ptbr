name: Dispatch launcher 1.4.6 release

'on':
  push:
    branches:
      - feat/diagnostics-schema-v4

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: Diagnóstico V4 com telemetria ampliada para suporte, evidências de runtime e Wine/Proton, além de reforços de privacidade.
        run: |
          gh workflow run release-launcher.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "version=1.4.6" \
            -f "release_notes=$RELEASE_NOTES" \
            -f "mandatory=false"
