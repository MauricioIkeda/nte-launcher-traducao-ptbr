name: Release Windows launcher

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version, without the v prefix"
        required: true
        type: string
      release_notes:
        description: "Short release notes shown in the launcher"
        required: true
        type: string
      mandatory:
        description: "Mark this update as mandatory"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-launcher
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.release_notes }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:INPUT_VERSION
            $notes = $env:INPUT_NOTES -replace '[\r\n]+', ' '
          } else {
            $version = $env:REF_NAME.TrimStart("v")
            $notes = "Atualização do launcher $version."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must use MAJOR.MINOR.PATCH."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Test project
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter test integration_test

      - name: Build Windows release
        run: >
          flutter build windows --release
          --build-name "${{ steps.version.outputs.version }}"
          --build-number "${{ github.run_number }}"

      - name: Sign launcher executable
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "nte-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object FullName -Like "*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found." }
          & $signTool sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD `
            "build\windows\x64\runner\Release\NTE-Launcher-Traducao-PTBR.exe"
          if ($LASTEXITCODE -ne 0) { throw "Launcher signing failed." }
          & $signTool verify /pa /v `
            "build\windows\x64\runner\Release\NTE-Launcher-Traducao-PTBR.exe"
          if ($LASTEXITCODE -ne 0) { throw "Launcher signature verification failed." }

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "installer\NTE-Launcher-Traducao-PTBR.iss"

      - name: Sign installer
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "nte-signing.pfx"
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object FullName -Like "*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          & $signTool sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD `
            "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }
          & $signTool verify /pa /v `
            "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }

      - name: Generate launcher manifest
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
          MANDATORY_UPDATE: ${{ inputs.mandatory }}
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString("o")
          $mandatory = if ($env:MANDATORY_UPDATE -eq "true") {
            "--mandatory"
          } else {
            $null
          }
          python tool\generate_launcher_manifest.py `
            --version "${{ steps.version.outputs.version }}" `
            --installer "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe" `
            --repository "${{ github.repository }}" `
            --output "assets\manifest\launcher_manifest.json" `
            --published-at $publishedAt `
            --release-notes $env:RELEASE_NOTES `
            $mandatory

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          gh release create $tag `
            "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "NTE Launcher Tradução PT-BR $tag" `
            --notes $env:RELEASE_NOTES

      - name: Update static launcher manifest on main
        shell: pwsh
        run: |
          $savedManifest = Join-Path $env:RUNNER_TEMP "launcher_manifest.json"
          Copy-Item "assets\manifest\launcher_manifest.json" $savedManifest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          Copy-Item $savedManifest "assets\manifest\launcher_manifest.json"
          git add "assets\manifest\launcher_manifest.json"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Launcher manifest is already current."
            exit 0
          }
          git commit -m "chore: publish launcher ${{ steps.version.outputs.version }}"
          git push origin main
