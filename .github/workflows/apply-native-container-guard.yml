name: Apply native container guard

on:
  push:
    branches:
      - agent/pre13-native-container-guard
    paths:
      - .github/workflows/apply-native-container-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pre13-native-container-guard
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply guarded source patch
        run: python tool/apply_native_container_guard.py

      - name: Check whitespace
        run: git diff --check

      - name: Remove one-shot patch machinery
        run: |
          rm tool/apply_native_container_guard.py
          rm .github/workflows/apply-native-container-guard.yml

      - name: Commit protection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: block native NTE container collisions"
          git push origin HEAD:agent/pre13-native-container-guard
