name: Diagnostics v4 bootstrap refinement

on:
  push:
    branches:
      - feat/diagnostics-schema-v4

permissions:
  contents: write

jobs:
  refine-bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Wire bootstrap diagnostics
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('lib/main.dart')
          main = main_path.read_text(encoding='utf-8')
          if "import 'dart:io';" not in main:
              main = main.replace("import 'dart:ui';\n", "import 'dart:io';\nimport 'dart:ui';\n", 1)
          if "import 'core/bootstrap_diagnostics.dart';" not in main:
              main = main.replace(
                  "import 'core/app_paths.dart';\n",
                  "import 'core/app_paths.dart';\nimport 'core/bootstrap_diagnostics.dart';\n",
                  1,
              )

          old_main = """void main(List<String> arguments) {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(LauncherBootstrap(arguments: arguments));
          }
          """
          new_main = """void main(List<String> arguments) {
            WidgetsFlutterBinding.ensureInitialized();
            BootstrapDiagnostics.recordSync(
              'process_started',
              details: {
                'arguments': arguments,
                'operatingSystem': Platform.operatingSystem,
                'operatingSystemVersion': Platform.operatingSystemVersion,
                'resolvedExecutable': Platform.resolvedExecutable,
              },
            );

            final previousFlutterError = FlutterError.onError;
            FlutterError.onError = (details) {
              BootstrapDiagnostics.recordSync(
                'flutter_uncaught_error',
                details: {
                  'exceptionType': details.exception.runtimeType.toString(),
                  'exception': details.exceptionAsString(),
                  'library': details.library,
                  'context': details.context?.toDescription(),
                  'stackTrace': details.stack
                      ?.toString()
                      .split('\\n')
                      .take(80)
                      .join('\\n'),
                },
              );
              if (previousFlutterError != null) {
                previousFlutterError(details);
              } else {
                FlutterError.presentError(details);
              }
            };

            final dispatcher = PlatformDispatcher.instance;
            final previousPlatformError = dispatcher.onError;
            dispatcher.onError = (error, stackTrace) {
              BootstrapDiagnostics.recordSync(
                'platform_uncaught_error',
                details: {
                  'errorType': error.runtimeType.toString(),
                  'error': error.toString(),
                  'stackTrace': stackTrace
                      .toString()
                      .split('\\n')
                      .take(80)
                      .join('\\n'),
                },
              );
              return previousPlatformError?.call(error, stackTrace) ?? false;
            };

            runApp(LauncherBootstrap(arguments: arguments));
          }
          """
          if 'flutter_uncaught_error' not in main:
              if old_main not in main:
                  raise SystemExit('main() anchor not found')
              main = main.replace(old_main, new_main, 1)

          start = main.index('Future<LauncherController> _initializeLauncher(')
          end = main.index('\nclass LauncherBootstrap', start)
          current_function = main[start:end]
          if 'bootstrap_failed' not in current_function:
              new_function = """Future<LauncherController> _initializeLauncher(List<String> arguments) async {
            try {
              await BootstrapDiagnostics.record(
                'bootstrap_stage',
                details: {'stage': 'trusted_http_initialize'},
              );
              await TrustedHttpClientFactory.initialize().timeout(
                const Duration(seconds: 15),
              );
              await BootstrapDiagnostics.record(
                'bootstrap_stage',
                details: {'stage': 'app_paths_create'},
              );
              final paths = await AppPaths.create().timeout(
                const Duration(seconds: 15),
              );
              await BootstrapDiagnostics.record(
                'bootstrap_stage',
                details: {'stage': 'service_graph_construct'},
              );
              final log = LauncherLog(paths.logFile);
              final integrity = FileIntegrityService();
              final safePaths = SafePathService();
              final receipts = ReceiptRepository(paths, log, safePaths);
              final installer = InstallationService(
                paths,
                log,
                integrity: integrity,
                safePaths: safePaths,
                receipts: receipts,
              );
              final verifier = TranslationVerificationService(
                integrity: integrity,
                receipts: receipts,
                safePaths: safePaths,
                log: log,
              );
              final elevation = ElevationService(log);
              final controller = LauncherController(
                paths: paths,
                log: log,
                appUpdates: AppUpdateService(paths, log),
                manifests: ManifestRepository(paths, log),
                downloads: DownloadService(paths, log, integrity: integrity),
                elevation: elevation,
                gamePlatforms: GamePlatformService(),
                installer: installer,
                settings: SettingsService(),
                verifier: verifier,
                migration: LegacyMigrationService(
                  paths: paths,
                  log: log,
                  integrity: integrity,
                  receipts: receipts,
                  safePaths: safePaths,
                ),
                preInstallation: PreInstallationService(
                  installer: installer,
                  elevation: elevation,
                ),
                autoInstall: arguments.contains('--install'),
              );
              await BootstrapDiagnostics.record(
                'bootstrap_completed',
                details: {'controllerCreated': true},
              );
              return controller;
            } catch (error, stackTrace) {
              BootstrapDiagnostics.recordSync(
                'bootstrap_failed',
                details: {
                  'errorType': error.runtimeType.toString(),
                  'error': error.toString(),
                  'stackTrace': stackTrace
                      .toString()
                      .split('\\n')
                      .take(80)
                      .join('\\n'),
                },
              );
              rethrow;
            }
          }
          """
              main = main[:start] + new_function + main[end:]
          main_path.write_text(main, encoding='utf-8')

          diagnostic_path = Path('lib/services/diagnostic_service.dart')
          diagnostic = diagnostic_path.read_text(encoding='utf-8')
          if "import '../core/bootstrap_diagnostics.dart';" not in diagnostic:
              diagnostic = diagnostic.replace(
                  "import '../core/app_paths.dart';\n",
                  "import '../core/app_paths.dart';\nimport '../core/bootstrap_diagnostics.dart';\n",
                  1,
              )
          if 'final bootstrapHistory = await BootstrapDiagnostics.readRecent();' not in diagnostic:
              diagnostic = diagnostic.replace(
                  "    final operationHistory = await _readOperationHistory();\n",
                  "    final operationHistory = await _readOperationHistory();\n"
                  "    final bootstrapHistory = await BootstrapDiagnostics.readRecent();\n",
                  1,
              )
          if "'bootstrapBlackBox': true" not in diagnostic:
              diagnostic = diagnostic.replace(
                  "        'runtimeLoaderEvidence': true,\n",
                  "        'runtimeLoaderEvidence': true,\n"
                  "        'bootstrapBlackBox': true,\n"
                  "        'globalErrorCapture': true,\n",
                  1,
              )
          if "'bootstrapHealth': _analyzeBootstrapHistory(bootstrapHistory)" not in diagnostic:
              diagnostic = diagnostic.replace(
                  "      'launcher': _redactObject(launcherState),\n",
                  "      'launcher': _redactObject(launcherState),\n"
                  "      'bootstrapHealth': _analyzeBootstrapHistory(bootstrapHistory),\n"
                  "      'bootstrapHistory': bootstrapHistory,\n",
                  1,
              )

          marker = "  Map<String, Object?> _analyzeStartupHistory(List<Object?> history) {"
          if '_analyzeBootstrapHistory(List<Object?> history)' not in diagnostic:
              method = """  Map<String, Object?> _analyzeBootstrapHistory(List<Object?> history) {
            final sessions = <String, Map<String, Object?>>{};
            final order = <String>[];
            for (final item in history) {
              if (item is! Map) continue;
              final sessionId = item['sessionId']?.toString();
              if (sessionId == null || sessionId.isEmpty) continue;
              final event = item['event']?.toString();
              final at = item['at']?.toString();
              final session = sessions.putIfAbsent(sessionId, () {
                order.add(sessionId);
                return {
                  'sessionId': sessionId,
                  'startedAt': at,
                  'completed': false,
                  'failed': false,
                  'uncaughtErrorCount': 0,
                };
              });
              session['lastEvent'] = event;
              session['lastEventAt'] = at;
              if (event == 'process_started') {
                session['startedAt'] = at;
              } else if (event == 'bootstrap_stage') {
                final details = item['details'];
                if (details is Map) {
                  session['lastStage'] = details['stage']?.toString();
                  session['lastStageAt'] = at;
                }
              } else if (event == 'bootstrap_completed') {
                session['completed'] = true;
                session['completedAt'] = at;
              } else if (event == 'bootstrap_failed') {
                session['failed'] = true;
                session['failedAt'] = at;
                session['failure'] = item['details'];
              } else if (event == 'flutter_uncaught_error' ||
                  event == 'platform_uncaught_error') {
                session['uncaughtErrorCount'] =
                    (session['uncaughtErrorCount'] as int? ?? 0) + 1;
                session['lastUncaughtError'] = item['details'];
                session['lastUncaughtErrorAt'] = at;
              }
            }
            final recent = order.reversed
                .take(10)
                .map((id) => sessions[id]!)
                .toList()
                .reversed
                .toList();
            return {
              'recentSessions': recent,
              'incompleteBootstrapCount': recent
                  .where((session) =>
                      session['completed'] != true && session['failed'] != true)
                  .length,
              'failedBootstrapCount': recent
                  .where((session) => session['failed'] == true)
                  .length,
              'uncaughtErrorCount': recent.fold<int>(
                0,
                (total, session) =>
                    total + (session['uncaughtErrorCount'] as int? ?? 0),
              ),
            };
          }

          """
              if marker not in diagnostic:
                  raise SystemExit('startup analyzer marker not found')
              diagnostic = diagnostic.replace(marker, method + marker, 1)
          diagnostic_path.write_text(diagnostic, encoding='utf-8')

          test_path = Path('test/launcher_controller_test.dart')
          test = test_path.read_text(encoding='utf-8')
          anchor = "    expect(decoded['startupHealth'], isA<Map<String, dynamic>>());\n"
          if "decoded['bootstrapHealth']" not in test:
              if anchor not in test:
                  raise SystemExit('diagnostic v4 test anchor not found')
              test = test.replace(
                  anchor,
                  anchor
                  + "    expect(decoded['bootstrapHealth'], isA<Map<String, dynamic>>());\n"
                  + "    expect(decoded['bootstrapHistory'], isA<List<dynamic>>());\n",
                  1,
              )
          test_path.write_text(test, encoding='utf-8')

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        run: dart format .

      - name: Analyze
        run: flutter analyze

      - name: Run focused tests
        run: flutter test test/launcher_controller_test.dart

      - name: Commit validated bootstrap diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/services/diagnostic_service.dart test/launcher_controller_test.dart
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "feat: capture bootstrap and uncaught runtime failures"
            git push
          fi
