name: Apply managed container integrity guard

on:
  push:
    branches:
      - agent/pre13-native-container-guard-v2
    paths:
      - .github/workflows/apply-managed-container-integrity-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/pre13-native-container-guard-v2
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply integrity guard
        run: python tool/apply_managed_container_integrity_guard.py

      - name: Check whitespace
        run: git diff --check

      - name: Remove one-shot patch machinery
        run: |
          rm tool/apply_managed_container_integrity_guard.py
          rm .github/workflows/apply-managed-container-integrity-guard.yml

      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: verify managed containers before replacement"
          git push origin HEAD:agent/pre13-native-container-guard-v2
