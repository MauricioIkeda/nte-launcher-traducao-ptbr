name: Diagnostics v4 refinement

on:
  push:
    branches:
      - feat/diagnostics-schema-v4

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Refine diagnostics
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"anchor not found: {label}")
              return text.replace(old, new, 1)

          controller_path = Path("lib/launcher_controller.dart")
          controller = controller_path.read_text(encoding="utf-8")
          controller = replace_once(
              controller,
              "    try {\n      final savedGameDirectory = await settings.getGameDirectory();",
              "    try {\n"
              "      await diagnostics.record(\n"
              "        'launcher_initialize_stage',\n"
              "        details: {'stage': 'settings'},\n"
              "      );\n"
              "      final savedGameDirectory = await settings.getGameDirectory();",
              "settings",
          )
          controller = replace_once(
              controller,
              "      await settings.setOfficialAutoplay(false);\n"
              "      final savedResolution = savedGameDirectory == null",
              "      await settings.setOfficialAutoplay(false);\n"
              "      await diagnostics.record(\n"
              "        'launcher_initialize_stage',\n"
              "        details: {'stage': 'game_directory_resolution'},\n"
              "      );\n"
              "      final savedResolution = savedGameDirectory == null",
              "directory",
          )
          controller = replace_once(
              controller,
              "      if (gameDirectory != null) {\n"
              "        await _detectGamePlatform(operation);\n"
              "      }\n\n"
              "      status = LauncherStatus.loadingManifest;",
              "      if (gameDirectory != null) {\n"
              "        await diagnostics.record(\n"
              "          'launcher_initialize_stage',\n"
              "          details: {'stage': 'platform_detection'},\n"
              "        );\n"
              "        await _detectGamePlatform(operation);\n"
              "      }\n\n"
              "      await diagnostics.record(\n"
              "        'launcher_initialize_stage',\n"
              "        details: {'stage': 'manifest_load'},\n"
              "      );\n"
              "      status = LauncherStatus.loadingManifest;",
              "platform-manifest",
          )
          controller = replace_once(
              controller,
              "      totalBytes = manifest?.totalBytes ?? 0;\n"
              "      if (loadedManifest != null && gameDirectory != null) {",
              "      totalBytes = manifest?.totalBytes ?? 0;\n"
              "      await diagnostics.record(\n"
              "        'launcher_initialize_stage',\n"
              "        details: {'stage': 'translation_recovery'},\n"
              "      );\n"
              "      if (loadedManifest != null && gameDirectory != null) {",
              "recovery",
          )
          controller = replace_once(
              controller,
              "        } else {\n          await migration.migrateWhenProvable(",
              "        } else {\n"
              "          await diagnostics.record(\n"
              "            'launcher_initialize_stage',\n"
              "            details: {'stage': 'legacy_migration'},\n"
              "          );\n"
              "          await migration.migrateWhenProvable(",
              "migration",
          )
          controller = replace_once(
              controller,
              "          await _verifyCurrent(operation);\n        }\n      } else {",
              "          await diagnostics.record(\n"
              "            'launcher_initialize_stage',\n"
              "            details: {'stage': 'translation_verification'},\n"
              "          );\n"
              "          await _verifyCurrent(operation);\n        }\n      } else {",
              "verification",
          )
          controller = replace_once(
              controller,
              "      await checkLauncherUpdates();\n      if (!_isCurrent(operation)) {",
              "      await diagnostics.record(\n"
              "        'launcher_initialize_stage',\n"
              "        details: {'stage': 'launcher_update_check'},\n"
              "      );\n"
              "      await checkLauncherUpdates();\n      if (!_isCurrent(operation)) {",
              "launcher-update",
          )
          controller = replace_once(
              controller,
              "      status = LauncherStatus.ready;\n"
              "      await log.info(\n"
              "        'Launcher inicializado; estado da tradução: '",
              "      await diagnostics.record(\n"
              "        'launcher_initialize_stage',\n"
              "        details: {'stage': 'finalizing'},\n"
              "      );\n"
              "      status = LauncherStatus.ready;\n"
              "      await log.info(\n"
              "        'Launcher inicializado; estado da tradução: '",
              "finalizing",
          )
          controller_path.write_text(controller, encoding="utf-8")

          diagnostic_path = Path("lib/services/diagnostic_service.dart")
          diagnostic = diagnostic_path.read_text(encoding="utf-8")
          diagnostic = replace_once(
              diagnostic,
              "      'uacPolicy': await _uacPolicy(),\n"
              "      'systemResources': await _systemResources(),",
              "      'uacPolicy': await _uacPolicy(),\n"
              "      'processMitigation': Platform.isWindows && !RuntimeEnvironment.isWine\n"
              "          ? await _powershellJson(\n"
              "              r'Get-ProcessMitigation -Name HTGame.exe -ErrorAction Stop | Select-Object DEP,ASLR,CFG,ImageLoad,Signature | ConvertTo-Json -Depth 6 -Compress',\n"
              "            )\n"
              "          : null,\n"
              "      'systemResources': await _systemResources(),",
              "process-mitigation",
          )
          diagnostic = replace_once(
              diagnostic,
              "      } else if (event == 'launcher_initialize_completed' && active != null) {",
              "      } else if (event == 'launcher_initialize_stage' && active != null) {\n"
              "        final details = item['details'];\n"
              "        if (details is Map) {\n"
              "          final stage = details['stage']?.toString();\n"
              "          if (stage != null && stage.isNotEmpty) {\n"
              "            active['lastStage'] = stage;\n"
              "            active['lastStageAt'] = at?.toIso8601String();\n"
              "          }\n"
              "        }\n"
              "      } else if (event == 'launcher_initialize_completed' && active != null) {",
              "startup-analyzer",
          )
          diagnostic = replace_once(
              diagnostic,
              "  Future<Map<String, String>?> _linuxDistribution() async {\n"
              "    if (!Platform.isLinux) return null;\n"
              "    final file = File('/etc/os-release');",
              "  Future<Map<String, String>?> _linuxDistribution() async {\n"
              "    final file = Platform.isLinux\n"
              "        ? File('/etc/os-release')\n"
              "        : Platform.isWindows && RuntimeEnvironment.isWine\n"
              "        ? File(r'Z:\\etc\\os-release')\n"
              "        : null;\n"
              "    if (file == null) return null;",
              "wine-distro",
          )
          diagnostic = replace_once(
              diagnostic,
              "    for (final file in existing.take(_maxGameLogs)) {",
              "    for (final file in existing.take(_maxGameLogs - 3)) {",
              "filtered-logs-reservation",
          )
          diagnostic_path.write_text(diagnostic, encoding="utf-8")

          test_path = Path("test/launcher_controller_test.dart")
          test = test_path.read_text(encoding="utf-8")
          anchor = "    expect(decoded['runtime'], isA<Map<String, dynamic>>());\n"
          if "fullGameClientSha256" not in test:
              additions = (
                  anchor
                  + "    expect(decoded['diagnosticCapabilities']['fullGameClientSha256'], isTrue);\n"
                  + "    expect(decoded['startupHealth'], isA<Map<String, dynamic>>());\n"
                  + "    expect(decoded['game']['translationRuntime'], isA<Map<String, dynamic>>());\n"
                  + "    expect(decoded['game']['modAndLoaderInventory'], isA<Map<String, dynamic>>());\n"
              )
              if anchor not in test:
                  raise SystemExit("anchor not found: v4 assertions")
              test = test.replace(anchor, additions, 1)
          test_path.write_text(test, encoding="utf-8")

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format
        run: dart format .

      - name: Commit refinements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/diagnostic_service.dart lib/launcher_controller.dart test/launcher_controller_test.dart
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "feat: add startup and security diagnostic telemetry"
            git push
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test diagnostics
        run: flutter test test/launcher_controller_test.dart
