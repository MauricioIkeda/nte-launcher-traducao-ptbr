name: One-shot final diagnostic privacy guard

on:
  push:
    branches:
      - feat/diagnostics-schema-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/diagnostics-schema-v4
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Apply final payload redaction guard
        shell: pwsh
        run: |
          $servicePath = 'lib/services/diagnostic_service.dart'
          $service = [System.IO.File]::ReadAllText($servicePath)
          $old = "`${const JsonEncoder.withIndent('  ').convert(payload)}\n"
          $new = "`${const JsonEncoder.withIndent('  ').convert(_redactObject(payload))}\n"
          if (-not $service.Contains($old)) {
            throw 'Diagnostic payload serialization target was not found.'
          }
          $service = $service.Replace($old, $new)
          [System.IO.File]::WriteAllText(
            $servicePath,
            $service,
            [System.Text.UTF8Encoding]::new($false)
          )
          dart format $servicePath
          git diff --check
          if (-not ([System.IO.File]::ReadAllText($servicePath).Contains("convert(_redactObject(payload))"))) {
            throw 'Final diagnostic redaction guard was not applied.'
          }

      - name: Analyze
        shell: pwsh
        run: flutter analyze

      - name: Run full test suite
        shell: pwsh
        run: flutter test

      - name: Commit validated change and remove helper
        shell: pwsh
        run: |
          Remove-Item '.github/workflows/diagnostics-v4-final-privacy-guard.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/diagnostic_service.dart .github/workflows/diagnostics-v4-final-privacy-guard.yml
          git commit -m "fix: apply final redaction pass to diagnostics"
          git push origin HEAD:feat/diagnostics-schema-v4
