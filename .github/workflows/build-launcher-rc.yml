name: Build launcher release candidate

on:
  workflow_dispatch:
  push:
    branches:
      - feat/diagnostics-schema-v4

permissions:
  contents: read

concurrency:
  group: launcher-rc-${{ github.ref }}
  cancel-in-progress: true

env:
  RC_VERSION: "1.4.6"

jobs:
  build-rc:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      HAS_WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Run integration tests
        run: flutter test integration_test

      - name: Build Windows release candidate
        run: >
          flutter build windows --release
          --build-name "${{ env.RC_VERSION }}"
          --build-number "${{ github.run_number }}"

      - name: Sign launcher executable
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "nte-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object FullName -Like "*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found." }
          & $signTool sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD `
            "build\windows\x64\runner\Release\NTE-Launcher-Traducao-PTBR.exe"
          if ($LASTEXITCODE -ne 0) { throw "Launcher signing failed." }
          & $signTool verify /pa /v `
            "build\windows\x64\runner\Release\NTE-Launcher-Traducao-PTBR.exe"
          if ($LASTEXITCODE -ne 0) { throw "Launcher signature verification failed." }

      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Build RC installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ env.RC_VERSION }}" `
            "installer\NTE-Launcher-Traducao-PTBR.iss"
          if ($LASTEXITCODE -ne 0) { throw "RC installer build failed." }

      - name: Sign RC installer
        if: env.HAS_WINDOWS_SIGNING_CERTIFICATE == 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "nte-signing.pfx"
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse |
            Where-Object FullName -Like "*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signTool) { throw "signtool.exe was not found." }
          & $signTool sign /fd SHA256 /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD `
            "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "RC installer signing failed." }
          & $signTool verify /pa /v `
            "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "RC installer signature verification failed." }

      - name: Package candidate artifacts
        shell: pwsh
        run: |
          $output = "build\rc"
          New-Item -ItemType Directory -Path $output -Force | Out-Null

          $portable = Join-Path $output `
            "NTE-Launcher-Traducao-PTBR-${{ env.RC_VERSION }}-RC-portable.zip"
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath $portable `
            -CompressionLevel Optimal

          $installer = "build\installer\NTE-Launcher-Traducao-PTBR-Setup.exe"
          $installerCopy = Join-Path $output `
            "NTE-Launcher-Traducao-PTBR-${{ env.RC_VERSION }}-RC-Setup.exe"
          Copy-Item $installer $installerCopy

          @"
          NTE Launcher Tradução PT-BR - Release Candidate
          Version: ${{ env.RC_VERSION }}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow run: ${{ github.run_id }}
          Built at UTC: $([DateTime]::UtcNow.ToString('o'))

          TEST BUILD ONLY.
          This artifact does not create a GitHub Release, tag, or update the
          public launcher manifest.
          "@ | Set-Content -Path (Join-Path $output "RC_INFO.txt") -Encoding UTF8

          $hashes = @(
            Get-FileHash $installerCopy -Algorithm SHA256,
            Get-FileHash $portable -Algorithm SHA256
          )
          $hashes | ForEach-Object {
            "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)"
          } | Set-Content -Path (Join-Path $output "SHA256SUMS.txt") -Encoding ASCII

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NTE-Launcher-PTBR-${{ env.RC_VERSION }}-RC-${{ github.run_number }}
          path: build/rc/*
          if-no-files-found: error
          retention-days: 7
