# Registered on main; this update intentionally triggers the one-shot workflow.
# Merged through GitHub so the push event is emitted by the platform.
name: Apply official autoplay hotfix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hotfix-disable-official-autoplay.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: hotfix-disable-official-autoplay
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Apply autoplay safety changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              content = file.read_text(encoding="utf-8")
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one match in {path}, found {count}: {old!r}"
                  )
              file.write_text(content.replace(old, new), encoding="utf-8")

          replace_once(
              "lib/main.dart",
              """          if (controller.gamePlatform?.platform == GamePlatform.official) ...[\n            const SizedBox(height: 10),\n            _OfficialAutoplayToggle(controller: controller),\n          ],\n""",
              """          // AutoPlay is intentionally hidden for the official client.\n          // Its cold /autoplay path can start the game before local resources\n          // are ready, causing character voices to disappear.\n          // if (controller.gamePlatform?.platform == GamePlatform.official) ...[\n          //   const SizedBox(height: 10),\n          //   _OfficialAutoplayToggle(controller: controller),\n          // ],\n""",
          )

          replace_once(
              "lib/launcher_controller.dart",
              "  bool officialAutoplay = true;\n",
              "  bool officialAutoplay = false;\n",
          )
          replace_once(
              "lib/launcher_controller.dart",
              "      officialAutoplay = await settings.getOfficialAutoplay();\n",
              """      // Force every existing installation away from the unsafe cold\n      // /autoplay path, including users who previously enabled the option.\n      officialAutoplay = false;\n      await settings.setOfficialAutoplay(false);\n""",
          )
          replace_once(
              "lib/launcher_controller.dart",
              "        officialAutoplay: officialAutoplay,\n",
              "        officialAutoplay: false,\n",
          )
          replace_once(
              "lib/launcher_controller.dart",
              """  Future<void> setOfficialAutoplay(bool value) async {\n    officialAutoplay = value;\n    await settings.setOfficialAutoplay(value);\n    _notify();\n  }\n""",
              """  Future<void> setOfficialAutoplay(bool value) async {\n    officialAutoplay = false;\n    await settings.setOfficialAutoplay(false);\n    _notify();\n  }\n""",
          )

          replace_once(
              "lib/services/settings_service.dart",
              "    return await _preferences.getBool(_officialAutoplayKey) ?? true;\n",
              "    return await _preferences.getBool(_officialAutoplayKey) ?? false;\n",
          )

          replace_once(
              "lib/services/game_platform_service.dart",
              "    bool officialAutoplay = true,\n",
              "    bool officialAutoplay = false,\n",
          )
          replace_once(
              "lib/services/game_platform_service.dart",
              """        await _gameExecutableLauncher(\n          executable.path,\n          officialAutoplay ? const ['/autoplay'] : const [],\n          gameDirectory,\n        );\n""",
              """        // Never use the official launcher's cold /autoplay path. It can\n        // start HTGame before local resources are ready and remove voices.\n        await _gameExecutableLauncher(\n          executable.path,\n          const [],\n          gameDirectory,\n        );\n""",
          )

          replace_once(
              "test/game_platform_service_test.dart",
              "  test('launches the official launcher with autoplay enabled', () async {\n",
              "  test('ignores autoplay and opens the official launcher normally', () async {\n",
          )
          replace_once(
              "test/game_platform_service_test.dart",
              "    await service.launch(info, gameDirectory.path);\n\n    expect(receivedExecutable, launcher.path);\n    expect(receivedArguments, const ['/autoplay']);\n",
              "    await service.launch(\n      info,\n      gameDirectory.path,\n      officialAutoplay: true,\n    );\n\n    expect(receivedExecutable, launcher.path);\n    expect(receivedArguments, isEmpty);\n",
          )

          replace_once(
              "pubspec.yaml",
              "version: 1.3.1+13\n",
              "version: 1.3.2+14\n",
          )

          Path(".github/workflows/hotfix-disable-official-autoplay.yml").unlink()

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Format and test
        run: |
          dart format lib/main.dart lib/launcher_controller.dart lib/services/game_platform_service.dart lib/services/settings_service.dart test/game_platform_service_test.dart
          flutter pub get
          flutter analyze
          flutter test
          flutter test integration_test

      - name: Commit hotfix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/hotfix-disable-official-autoplay.yml \
            lib/main.dart \
            lib/launcher_controller.dart \
            lib/services/game_platform_service.dart \
            lib/services/settings_service.dart \
            test/game_platform_service_test.dart \
            pubspec.yaml
          git commit -m "fix: disable official launcher autoplay"
          git push origin HEAD:main

      - name: Publish launcher 1.3.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run release-launcher.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f version=1.3.2 \
            -f release_notes="Desativa o AutoPlay no cliente oficial para preservar as vozes e abre o launcher para o clique manual em Play." \
            -f mandatory=false
