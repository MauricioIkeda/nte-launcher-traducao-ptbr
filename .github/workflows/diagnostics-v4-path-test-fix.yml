name: One-shot diagnostic path test fixer

on:
  push:
    branches:
      - feat/diagnostics-schema-v4

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/diagnostics-schema-v4
          fetch-depth: 0

      - name: Update diagnostic path expectations
        shell: pwsh
        run: |
          $path = 'test/launcher_controller_test.dart'
          $content = [System.IO.File]::ReadAllText($path)
          $pattern = "    expect\(decoded\['launcher'\]\['gameDirectory'\], game\.path\);\r?\n    expect\(decoded\['game'\]\['normalizedDirectory'\], game\.path\);"
          $replacement = "    final redactedGamePath = LauncherLog.redactSensitiveValues(game.path);`n    expect(decoded['launcher']['gameDirectory'], redactedGamePath);`n    expect(decoded['game']['normalizedDirectory'], redactedGamePath);"
          $updated = [regex]::Replace($content, $pattern, $replacement)
          if ($updated -eq $content) {
            throw 'Expected diagnostic path assertions were not found.'
          }
          [System.IO.File]::WriteAllText(
            $path,
            $updated,
            [System.Text.UTF8Encoding]::new($false)
          )
          Remove-Item '.github/workflows/diagnostics-v4-path-test-fix.yml'
          git diff --check

      - name: Commit fix and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/launcher_controller_test.dart .github/workflows/diagnostics-v4-path-test-fix.yml
          git commit -m "test: expect redacted diagnostic profile paths"
          git push origin HEAD:feat/diagnostics-schema-v4
